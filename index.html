<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Full Screen Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            width: 100vw;
            height: 100dvh;
        }

        /* =========================
           VIDEO CONTAINER
        ========================= */

        .video-container {
            position: relative;

            width: 100%;
            height: 100dvh;

            overflow: hidden;
            background: #000;
        }

        /* =========================
           VIDEO
        ========================= */

        #mainVideo {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: block;

            /*
                Fills the entire screen
                without stretching the video.
            */
            object-fit: cover;
            object-position: center;

            background: #000;
        }

        /* =========================
           BUTTON
        ========================= */

        .continue-button {
            position: absolute;

            left: 50%;
            bottom: 7%;

            transform: translate(-50%, 20px);

            padding: 14px 32px;

            border: none;
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.95);
            color: #111;

            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 500;

            cursor: pointer;

            opacity: 0;
            visibility: hidden;

            /*
                Button is initially invisible.
            */
            transition:
                opacity 0.8s ease,
                transform 0.8s ease,
                visibility 0.8s ease;

            z-index: 10;

            -webkit-tap-highlight-color: transparent;
        }

        /*
            Button appears after video ends.
        */
        .continue-button.show {
            opacity: 1;
            visibility: visible;

            transform: translate(-50%, 0);
        }

        /*
            Small hover effect for desktop.
        */
        .continue-button:hover {
            transform: translate(-50%, -2px);
            background: #fff;
        }

        /*
            Better touch experience on mobile.
        */
        .continue-button:active {
            transform: translate(-50%, 0);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {
            .continue-button {
                bottom: 6%;

                padding: 13px 28px;

                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="video-container">

        <video
            id="mainVideo"
            autoplay
            muted
            playsinline
            preload="auto"
            disablepictureinpicture
        >
            <source
                src="Add a heading.mp4"
                type="video/mp4"
            >

            Your browser does not support HTML5 video.
        </video>


        <!--
            This button stays hidden
            until the video finishes.
        -->
        <button
            id="continueButton"
            class="continue-button"
            type="button"
        >
            Continue
        </button>

    </div>


    <script>
        const video = document.getElementById("mainVideo");
        const button = document.getElementById("continueButton");


        /* =========================
           VIDEO SETTINGS
        ========================= */

        video.loop = false;


        /* =========================
           AUTOPLAY
        ========================= */

        window.addEventListener("load", async () => {
            try {
                await video.play();
            } catch (error) {
                console.log("Autoplay was blocked:", error);
            }
        });


        /* =========================
           VIDEO ENDED
        ========================= */

        video.addEventListener("ended", () => {

            /*
                Pause the video.
                It will remain on the final frame.
            */
            video.pause();

            /*
                Make absolutely sure
                the playhead stays at the end.
            */
            if (Number.isFinite(video.duration)) {
                video.currentTime = video.duration;
            }

            /*
                Wait a tiny moment so the final
                frame is rendered before showing
                the button.
            */
            requestAnimationFrame(() => {
                button.classList.add("show");
            });
        });


        /* =========================
           BUTTON
        ========================= */

        button.addEventListener("click", () => {
            window.location.href = "canvaembed.html";
        });

        video.addEventListener("ended", () => {
            video.pause();

            if (Number.isFinite(video.duration)) {
                video.currentTime = video.duration;
            }

            requestAnimationFrame(() => {
                button.classList.add("show");
            });

            setTimeout(() => {
                window.location.href = "canvaembed.html";
            }, 1200);
        });
    </script>

</body>
</html>
